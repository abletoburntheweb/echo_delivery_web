<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ Календарь | ECHO Corp.</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'core/css/a_admin.css' %}?v=5">
</head>
<body>
    <div class="header">
        <span class="header-title">ECHO Corp.</span>
        <div class="header-buttons">
            <a href="{% url 'admin_logout' %}" class="profile-button">🚪</a>
            <span class="unused-button">📅</span>
            <a href="{% url 'admin_panel' %}" class="profile-button">📋</a>
        </div>
    </div>

    <div class="main-content">
        <div class="container calendar-container">
            <h2 class="weekday-title">Календарь</h2>
            <div class="calendar-grid-wrapper">
                <div class="weekdays-grid">
                    <div class="weekday">Пн</div>
                    <div class="weekday">Вт</div>
                    <div class="weekday">Ср</div>
                    <div class="weekday">Чт</div>
                    <div class="weekday">Пт</div>
                    <div class="weekday">Сб</div>
                    <div class="weekday">Вс</div>
                </div>

                <div class="calendar-grid">
                    {% for i in "0123456"|make_list %}
                        {% if i|add:"0" < days.0.weekday %}
                            <div class="empty-cell"></div>
                        {% endif %}
                    {% endfor %}
                    {% for day_info in days %}
                        <div class="day-btn{% if day_info.is_today %} today{% endif %}{% if day_info.has_orders %} has-orders{% endif %}"
                             data-date="{{ day_info.date|date:'Y-m-d' }}"
                             title="{% if day_info.has_orders %}Заказов: {{ day_info.orders_count }}{% else %}Нет заказов{% endif %}">
                            {{ day_info.date.day }}
                        </div>
                    {% endfor %}
                </div>
            </div>

            <form id="calendar-form" method="post">
                {% csrf_token %}
                <input type="hidden" id="selected-date" name="selected_date" value="">
                <button class="accept-button" type="submit">Принять</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dayButtons = document.querySelectorAll('.day-btn');
            const selectedDateInput = document.getElementById('selected-date');

            function selectDay(button) {
                dayButtons.forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');
                selectedDateInput.value = button.getAttribute('data-date');
            }

            dayButtons.forEach(button => {
                button.addEventListener('click', function() {
                    selectDay(this);
                });
            });

            if (selectedDateInput.value) {
                const previouslySelectedButton = document.querySelector(`.day-btn[data-date="${selectedDateInput.value}"]`);
                if (previouslySelectedButton) {
                    selectDay(previouslySelectedButton);
                }
            } else {
                const today = new Date().toISOString().split('T')[0];
                const todayButton = document.querySelector(`.day-btn[data-date="${today}"]`);
                if (todayButton) {
                    selectDay(todayButton);
                }
            }
        });
    </script>
</body>
</html>
